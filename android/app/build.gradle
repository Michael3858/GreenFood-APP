plugins {
    id 'com.android.application'
}

// Read deployment settings from Gradle properties; private values belong in the user's Gradle home.
def quotedSetting = { name, fallback ->
    def value = (project.findProperty(name) ?: fallback).toString()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.example.greenfood"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'API_BASE_URL', quotedSetting('GREENFOOD_API_BASE_URL', 'http://10.0.2.2/greenfood/')
        buildConfigField 'String', 'DEMO_ADMIN_ACCOUNT', quotedSetting('GREENFOOD_DEMO_ADMIN_ACCOUNT', '')
        buildConfigField 'String', 'DEMO_ADMIN_PASSWORD', quotedSetting('GREENFOOD_DEMO_ADMIN_PASSWORD', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.0-alpha08'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
android {
    useLibrary 'org.apache.http.legacy'
    buildFeatures {
        viewBinding true
    }
}